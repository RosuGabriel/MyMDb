upstream api_backend {
    server api:5000;
}

server {
    listen 80;
    server_name mymdb;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend
    location /mymdb/api/ {
        proxy_pass http://api_backend/mymdb/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range request support for video streaming
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Large file upload support
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Video streaming - disable buffering
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy static files to backend
    location /mymdb/static/ {
        proxy_pass http://api_backend/mymdb/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - route all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
